  <text x="1000.00" y="700.00" text-anchor="middle" class="tt">on the base outside diameter</text>
  <text x="1000.00" y="722.00" text-anchor="middle" class="ts">alternative</text>
  <text x="1000.00" y="836.00" text-anchor="middle" class="tg">a collar on ⌀33.02 — a dimension Comar does hold</text>
