  <polygon points="734.16,300.00 736.56,292.00 731.76,292.00" class="arrowa"/>
  <text x="741.16" y="294.40" text-anchor="start" class="ta">1.20</text>
  <text x="741.16" y="330.00" text-anchor="start" class="ta">not dimensioned</text>
  <text x="400.00" y="46.00" text-anchor="middle" class="tt">the feature the puck grips is the one nobody specifies</text>
  <text x="400.00" y="70.00" text-anchor="middle" class="ts">Comar 22-0263, base in section</text>
  <text x="880.00" y="130.00" text-anchor="start" class="tg">dimensioned on all four Comar dosage-cup drawings</text>
  <text x="894.00" y="158.00" text-anchor="start" class="ts">·  rim outside diameter</text>
  <text x="894.00" y="180.00" text-anchor="start" class="ts">·  rim inside diameter</text>
  <text x="894.00" y="202.00" text-anchor="start" class="ts">·  overall height</text>
  <text x="894.00" y="224.00" text-anchor="start" class="ts">·  base outside diameter</text>
  <text x="894.00" y="246.00" text-anchor="start" class="ts">·  internal core diameters (closure clearance, rib circle)</text>
  <text x="880.00" y="294.00" text-anchor="start" class="ta">drawn but never dimensioned, on any of them</text>
  <text x="894.00" y="322.00" text-anchor="start" class="ts">·  base recess diameter</text>
  <text x="894.00" y="344.00" text-anchor="start" class="ts">·  base recess depth</text>
  <text x="894.00" y="366.00" text-anchor="start" class="ts">·  recess wall draft</text>
  <text x="894.00" y="388.00" text-anchor="start" class="ts">·  foot ring radial width</text>
  <text x="894.00" y="410.00" text-anchor="start" class="ts">·  gate witness height</text>
  <text x="894.00" y="432.00" text-anchor="start" class="ts">·  corner radii</text>
  <text x="880.00" y="476.00" text-anchor="start" class="ts">The recess is there so the cup has a standing ring.</text>
  <text x="880.00" y="497.00" text-anchor="start" class="ts">It is a consequence of that, not a specified feature.</text>
  <text x="880.00" y="518.00" text-anchor="start" class="ts">No tolerance is published, and nothing obliges the</text>
  <text x="880.00" y="539.00" text-anchor="start" class="ts">moulder to hold it across a tool revision.</text>
  <line x1="60.00" y1="626.00" x2="1340.00" y2="626.00" class="ext"/>
  <text x="700.00" y="652.00" text-anchor="middle" class="tt">two things the puck could register on</text>
