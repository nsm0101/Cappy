  <text x="650.00" y="46.00" text-anchor="middle" class="tt">CSP-30  ·  the profile Cappy designs to</text>
  <text x="650.00" y="70.00" text-anchor="middle" class="ts">a nominal and a band, owned by us — not any supplier's part number</text>
  <line x1="80.00" y1="600.00" x2="1220.00" y2="600.00" class="ext"/>
  <text x="80.00" y="632.00" text-anchor="start" class="tt">the three banded dimensions</text>
  <text x="80.00" y="668.00" text-anchor="start" class="ts">recess ⌀</text>
  <text x="80.00" y="688.00" text-anchor="start" class="ta">30.50 -0.75/+0.75 (29.75–31.25)</text>
  <text x="80.00" y="714.00" text-anchor="start" class="ts">recess depth</text>
  <text x="80.00" y="734.00" text-anchor="start" class="ta">2.00 -0.30/+0.30 (1.70–2.30)</text>
  <text x="80.00" y="760.00" text-anchor="start" class="ts">base outside ⌀</text>
  <text x="80.00" y="780.00" text-anchor="start" class="td">33.00 -0.75/+0.75 (32.25–33.75)</text>
  <text x="560.00" y="632.00" text-anchor="start" class="tt">how to read it</text>
  <text x="560.00" y="664.00" text-anchor="start" class="ts">The dashed outlines are the two limit recesses the puck has to work in —</text>
  <text x="560.00" y="685.00" text-anchor="start" class="ts">the smallest it must still enter, and the largest it must still grip.</text>
  <text x="560.00" y="706.00" text-anchor="start" class="ts"></text>
  <text x="560.00" y="727.00" text-anchor="start" class="ts">The band is PROVISIONAL: centred on the evidence in this package and</text>
  <text x="560.00" y="748.00" text-anchor="start" class="ts">widened to a defensible guess. Twelve cups off the pharmacy shelf</text>
  <text x="560.00" y="769.00" text-anchor="start" class="ts">replaces the guess with a measurement.</text>
  <text x="560.00" y="790.00" text-anchor="start" class="ts"></text>
  <text x="560.00" y="811.00" text-anchor="start" class="ts">Every 0.1 mm the diameter band tightens hands 0.05 mm of pad travel</text>
  <text x="560.00" y="832.00" text-anchor="start" class="ts">back to the design. Tightening it is worth real money in retention.</text>
