  <text x="662.00" y="662.00" text-anchor="start" class="ts">Draft on the recess wall is real but sits below the resolution of the</text>
  <text x="662.00" y="683.00" text-anchor="start" class="ts">source drawing: any half-angle from 0° to about 3° is consistent with it.</text>
  <text x="662.00" y="704.00" text-anchor="start" class="ts">Treat ⌀30.53 as the diameter at the opening and allow the deepest</text>
  <text x="662.00" y="725.00" text-anchor="start" class="ts">plane to be up to 0.13 mm smaller until a sample is measured.</text>
  <text x="662.00" y="746.00" text-anchor="start" class="ts"></text>
  <text x="662.00" y="767.00" text-anchor="start" class="ts">Corner radii are likewise not resolvable; ~0.3 mm is typical for the</text>
  <text x="662.00" y="788.00" text-anchor="start" class="ts">heel of a moulded PP cup.</text>
  <text x="662.00" y="809.00" text-anchor="start" class="ts"></text>
  <text x="662.00" y="830.00" text-anchor="start" class="ts">The ⌀3.7 gate witness sits in the centre of the recess ceiling. If it</text>
  <text x="662.00" y="851.00" text-anchor="start" class="ts">stands proud rather than flush, a rigid puck will rock on it — check a</text>
  <text x="662.00" y="872.00" text-anchor="start" class="ts">sample with a straightedge before fixing the puck's back face flat.</text>
