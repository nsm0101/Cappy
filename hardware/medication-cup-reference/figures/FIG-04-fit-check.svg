  <text x="1044.00" y="836.00" text-anchor="start" class="tt">FIG. 4  FIT CHECK</text>
  <text x="1044.00" y="856.00" text-anchor="start" class="ts">depth spread</text>
  <text x="1384.00" y="856.00" text-anchor="end" class="ts">1.20 – 2.10 mm</text>
  <text x="1044.00" y="876.00" text-anchor="start" class="ts">diameter spread</text>
  <text x="1384.00" y="876.00" text-anchor="end" class="ts">⌀27.50 – ⌀30.53</text>
  <text x="1044.00" y="896.00" text-anchor="start" class="ts">physically measured</text>
  <text x="1384.00" y="896.00" text-anchor="end" class="ts">depth only, one cup</text>
  <text x="1044.00" y="916.00" text-anchor="start" class="ts">scale</text>
