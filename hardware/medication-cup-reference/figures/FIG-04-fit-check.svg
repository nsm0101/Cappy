  <text x="884.70" y="463.60" text-anchor="start" class="td">2.00</text>
  <text x="884.70" y="500.00" text-anchor="start" class="ts">deep</text>
  <text x="660.00" y="250.00" text-anchor="middle" class="tt">founder's cast of the sample cup</text>
  <text x="660.00" y="272.00" text-anchor="middle" class="ts">the cup Cappy is for</text>
  <text x="660.00" y="296.00" text-anchor="middle" class="tg">MEASURED — your cast</text>
  <text x="660.00" y="610.00" text-anchor="middle" class="ta">⌀ NOT MEASURED YET</text>
  <text x="660.00" y="634.00" text-anchor="middle" class="ta">this is the number that decides it</text>
  <text x="660.00" y="658.00" text-anchor="middle" class="tg">puck sits 0.20 mm inside the ring</text>
