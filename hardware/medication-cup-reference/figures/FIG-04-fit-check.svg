  <text x="1324.70" y="467.76" text-anchor="start" class="td">1.20</text>
  <text x="1324.70" y="500.00" text-anchor="start" class="ts">deep</text>
  <text x="1100.00" y="250.00" text-anchor="middle" class="tt">Comar 22-0263, from the drawing</text>
  <text x="1100.00" y="272.00" text-anchor="middle" class="ts">a real catalogue cup</text>
  <text x="1100.00" y="296.00" text-anchor="middle" class="ta">DERIVED — Comar drawing</text>
  <text x="1100.00" y="610.00" text-anchor="middle" class="ta">⌀30.53   +1.52 mm per side</text>
  <text x="1100.00" y="634.00" text-anchor="middle" class="ta">pads reach only 1.25 — no grip</text>
  <text x="1100.00" y="658.00" text-anchor="middle" class="ta">puck 0.60 mm proud — cup rocks</text>
  <text x="710.00" y="46.00" text-anchor="middle" class="tt">the recess is not one number</text>
  <text x="710.00" y="70.00" text-anchor="middle" class="ts">the same ⌀27.50 × 1.80 puck, in the three recesses we have characterisations for</text>
  <text x="710.00" y="748.00" text-anchor="middle" class="ts">Depth runs from 1.20 to 2.10 across the three. Your cast at 2.00 vindicates the</text>
  <text x="710.00" y="769.00" text-anchor="middle" class="ts">depth NMP-001 assumed, for your cup — the 1.80 puck finishes 0.20 mm inside the</text>
  <text x="710.00" y="790.00" text-anchor="middle" class="ts">foot plane, which is a working fit. It says nothing about the catalogue cup at 1.20.</text>
  <text x="710.00" y="811.00" text-anchor="middle" class="ts"></text>
  <text x="710.00" y="832.00" text-anchor="middle" class="ts">Diameter is the open question. It has never been measured on a physical recess.</text>
  <text x="710.00" y="853.00" text-anchor="middle" class="ts">NMP-001 assumes ⌀27.50; the one drawing we can read says ⌀30.53. Your cast can</text>
  <text x="710.00" y="874.00" text-anchor="middle" class="ts">settle it in thirty seconds with a pair of calipers across its widest point.</text>
  <text x="710.00" y="895.00" text-anchor="middle" class="ts"></text>
  <text x="710.00" y="916.00" text-anchor="middle" class="ts">Only the right-hand base outline is a real cup. The other two are schematic:</text>
  <text x="710.00" y="937.00" text-anchor="middle" class="ts">the depth and the puck are to scale, the surrounding cup is not.</text>
